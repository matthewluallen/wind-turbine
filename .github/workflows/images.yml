name: Build and mirror images

# Publishes every image a Codespace needs under ghcr.io/matthewluallen/wind-turbine
# so that launching a Codespace does not depend on anyone else's registry.
# Upstream sources are only contacted here, when this workflow runs.
#
# To move to a newer upstream version: change the version below AND the
# matching tag in docker-compose.yml (or .devcontainer/*/devcontainer.json),
# then test one Codespace before telling the class.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/images.yml
      - Dockerfile.devcontainer
      - Dockerfile.tools
      - Dockerfile.grafana
      - configs/docker/**

env:
  REGISTRY: ghcr.io/matthewluallen/wind-turbine
  OTSIM_TAG: 9dc3304            # ghcr.io/patsec/ot-sim build to mirror
  OPENSEARCH_VERSION: 2.11.1
  GRAFANA_VERSION: 13.0.2
  OPENSEARCH_PLUGIN_VERSION: 2.13.0
  GRAFANA_BUILD: r2             # bump when Dockerfile.grafana changes
  TOOLS_TAG: v2
  DEVCONTAINER_TAG: v2
  # Intel/AMD (Codespaces, most PCs) and ARM (Apple Silicon Macs)
  PLATFORMS: linux/amd64,linux/arm64

permissions:
  contents: read
  packages: write

jobs:
  images:
    if: github.repository == 'matthewluallen/wind-turbine'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to ghcr.io
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Set up multi-platform builds
        run: |
          docker run --privileged --rm tonistiigi/binfmt --install arm64
          docker buildx create --name multi --driver docker-container --use
          docker buildx inspect --bootstrap

      # imagetools copies every processor variant the upstream image publishes
      - name: Mirror OT-sim and OpenSearch
        run: |
          docker buildx imagetools create -t "$REGISTRY/ot-sim:$OTSIM_TAG" "ghcr.io/patsec/ot-sim:$OTSIM_TAG"
          docker buildx imagetools create -t "$REGISTRY/opensearch:$OPENSEARCH_VERSION" "opensearchproject/opensearch:$OPENSEARCH_VERSION"

      - name: Build and push tools image
        run: |
          docker buildx build --platform "$PLATFORMS" -f Dockerfile.tools \
            -t "$REGISTRY/tools:$TOOLS_TAG" --push .

      - name: Build and push Grafana image
        run: |
          docker buildx build --platform "$PLATFORMS" -f Dockerfile.grafana \
            --build-arg GRAFANA_VERSION="$GRAFANA_VERSION" \
            --build-arg OPENSEARCH_PLUGIN_VERSION="$OPENSEARCH_PLUGIN_VERSION" \
            -t "$REGISTRY/grafana:$GRAFANA_VERSION-opensearch-$OPENSEARCH_PLUGIN_VERSION-$GRAFANA_BUILD" --push .

      # The base image is Dockerfile.devcontainer plus Docker-in-Docker and an
      # SSH server (so `gh codespace ssh` works). The dev container config for
      # it is written here, not kept in the repo, so the only devcontainer.json
      # files in the repo are the ones students choose from.
      - name: Build and push Codespace base image
        run: |
          mkdir -p /tmp/base/.devcontainer
          cp Dockerfile.devcontainer /tmp/base/.devcontainer/Dockerfile
          cat > /tmp/base/.devcontainer/devcontainer.json <<'JSON'
          {
            "name": "wind-turbine-base",
            "build": { "dockerfile": "Dockerfile" },
            "features": {
              "ghcr.io/devcontainers/features/docker-in-docker:2": {},
              "ghcr.io/devcontainers/features/sshd:1": {}
            }
          }
          JSON
          npm install -g @devcontainers/cli
          devcontainer build \
            --workspace-folder /tmp/base \
            --platform "$PLATFORMS" \
            --image-name "$REGISTRY/devcontainer:$DEVCONTAINER_TAG" \
            --push
